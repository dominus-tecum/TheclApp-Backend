<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheClapp | Medical Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f8;
            color: #1a2a3a;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #0f2b3d 0%, #1a3a4f 100%);
            color: white;
            padding: 24px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header p {
            opacity: 0.8;
            font-size: 14px;
            margin-top: 8px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            padding: 32px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid;
            transition: all 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 8px;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: 800;
        }
        
        /* Main Container */
        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 32px 32px 32px;
        }
        
        /* Filters */
        .filters {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .filter-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        
        .filter-group {
            flex: 1;
            min-width: 180px;
        }
        
        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
        }
        
        select, input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            background: white;
            font-family: 'Inter', sans-serif;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #2d6a4f;
            box-shadow: 0 0 0 3px rgba(45,106,79,0.1);
        }
        
        .refresh-btn {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .refresh-btn:hover {
            background: #1b4d3e;
            transform: translateY(-1px);
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            background: white;
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            cursor: pointer;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s;
            background: transparent;
            border: none;
            font-family: 'Inter', sans-serif;
        }
        
        .tab.active {
            background: #2d6a4f;
            color: white;
        }
        
        /* Entry Cards */
        .entries-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .entry-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.2s;
        }
        
        .entry-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        
        .card-header {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            padding: 20px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .patient-info h3 {
            font-size: 18px;
            font-weight: 700;
            color: #0f2b3d;
            margin-bottom: 4px;
        }
        
        .patient-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #64748b;
        }
        
        .badge-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .condition-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-urgent { background: #fee2e2; color: #dc2626; }
        .status-monitor { background: #fef3c7; color: #d97706; }
        .status-good { background: #dcfce7; color: #16a34a; }
        
        /* Card Body */
        .card-body {
            padding: 24px;
        }
        
        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .metric-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px;
        }
        
        .metric-section h4 {
            font-size: 14px;
            font-weight: 600;
            color: #0f2b3d;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .metric-row:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
        }
        
        .metric-value {
            font-size: 13px;
            font-weight: 600;
            color: #1a2a3a;
        }
        
        .metric-value.highlight {
            color: #2d6a4f;
        }
        
        /* Photo Gallery */
        .photo-gallery {
            margin-top: 16px;
        }
        
        .photo-gallery h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .photo-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .photo-thumb {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #e2e8f0;
            transition: all 0.2s;
        }
        
        .photo-thumb:hover {
            transform: scale(1.05);
            border-color: #2d6a4f;
        }
        
        /* Notes Section */
        .notes-section {
            background: #fffbeb;
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
        }
        
        .notes-section h4 {
            font-size: 14px;
            font-weight: 600;
            color: #d97706;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .notes-text {
            font-size: 13px;
            color: #92400e;
            line-height: 1.5;
        }
        
        /* Expand/Collapse */
        .expand-btn {
            background: none;
            border: none;
            color: #2d6a4f;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
        }
        
        .expand-btn:hover {
            text-decoration: underline;
        }
        
        .detailed-metrics {
            margin-top: 16px;
        }
        
        /* Patient Cards */
        .patients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        
        .patient-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.2s;
        }
        
        .patient-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        
        .patient-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .patient-conditions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 12px 0;
        }
        
        .patient-condition-tag {
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: #64748b;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #2d6a4f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }

     

        
        /* Responsive */
        @media (max-width: 768px) {
            .stats-grid {
                padding: 16px;
                gap: 12px;
            }
            .main-container {
                padding: 0 16px 16px 16px;
            }
            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>



    <!-- Combined Login/Register Overlay -->
<div id="authOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f4f8; z-index: 2000; justify-content: center; align-items: center; overflow-y: auto;">
    <div style="background: white; border-radius: 24px; padding: 40px; max-width: 450px; width: 90%; margin: 20px auto; box-shadow: 0 20px 40px rgba(0,0,0,0.1);">
        
        <!-- Tabs -->
        <div style="display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0;">
            <button id="loginTabBtn" style="flex: 1; background: none; border: none; padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer; color: #2d6a4f; border-bottom: 2px solid #2d6a4f;">Login</button>
            <button id="registerTabBtn" style="flex: 1; background: none; border: none; padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer; color: #6c757d;">Register</button>
        </div>
        
        <!-- Login Form -->
<div id="loginFormContainer">
    <form id="loginForm">
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600;">Email</label>
            <input type="email" id="loginEmail" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px;" required>
        </div>
        <div style="margin-bottom: 20px; position: relative;">
            <label style="display: block; margin-bottom: 6px; font-weight: 600;">Password</label>
            <input type="password" id="loginPassword" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; padding-right: 45px;" required>
            <span onclick="togglePasswordVisibility()" style="position: absolute; right: 12px; bottom: 12px; cursor: pointer; color: #64748b; font-size: 20px;">👁️</span>
        </div>
        <button type="submit" style="width: 100%; background: #2d6a4f; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer;">Login</button>
        <div id="loginError" style="color: #dc2626; margin-top: 12px; text-align: center; display: none;"></div>
    </form>
</div>
        
        <!-- Register Form -->
        <div id="registerFormContainer" style="display: none;">
            <form id="registerForm">
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Full Name</label>
                    <input type="text" id="regName" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;" required>
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Username</label>
                    <input type="text" id="regUsername" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;" required>
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Email</label>
                    <input type="email" id="regEmail" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;" required>
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Phone Number</label>
                    <input type="tel" id="regPhone" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Role</label>
                    <select id="regRole" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;">
                        <option value="doctor">Doctor</option>
                        <option value="nurse">Nurse</option>
                        <option value="staff">Staff</option>
                    </select>
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Password</label>
                    <input type="password" id="regPassword" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;" required>
                </div>
                <button type="submit" style="width: 100%; background: #2d6a4f; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer;">Register</button>
                <div id="registerError" style="color: #dc2626; margin-top: 12px; text-align: center; display: none;"></div>
                <div id="registerSuccess" style="color: #16a34a; margin-top: 12px; text-align: center; display: none;"></div>
            </form>
            <div style="background: #f0f9ff; padding: 12px; border-radius: 12px; margin-top: 20px; font-size: 12px; color: #0ea5e9; text-align: center;">
                ⏳ Registration requires admin approval. You will be notified when approved.
            </div>
        </div>
    </div>
</div>




<!-- Register Staff Modal -->
<div id="registerModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center;">
    <div style="background: white; border-radius: 24px; padding: 32px; max-width: 450px; width: 90%;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="color: #0f2b3d;">➕ Register Staff</h3>
            <button onclick="closeRegisterModal()" style="background: none; border: none; font-size: 24px; cursor: pointer;">&times;</button>
        </div>
        <form id="registerStaffForm">
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Full Name</label>
                <input type="text" id="staffName" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;" required>
            </div>
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Username</label>
                <input type="text" id="staffUsername" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;" required>
            </div>
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Email</label>
                <input type="email" id="staffEmail" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;" required>
            </div>
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Password</label>
                <input type="password" id="staffPassword" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;" required>
            </div>
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600;">Role</label>
                <select id="staffRole" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px;">
                    <option value="doctor">Doctor</option>
                    <option value="nurse">Nurse</option>
                    <option value="staff">Staff</option>
                </select>
            </div>
            <button type="submit" style="width: 100%; background: #2d6a4f; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer;">Register</button>
            <div id="registerError" style="color: #dc2626; margin-top: 12px; text-align: center; display: none;"></div>
        </form>
    </div>
</div>


    <div class="header">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>
            🏥 Theclapp Medical Dashboard
        </h1>
        <button onclick="logout()" style="background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;">
            🔓 Logout
        </button>
    </div>
    <p>Comprehensive patient recovery monitoring across all conditions</p>
</div>



    <div class="stats-grid" id="statsGrid">
        <div class="loading"><div class="spinner"></div>Loading statistics...</div>
    </div>
    
    <div class="main-container">
        <div class="filters">
            <div class="filter-row">
                <div class="filter-group">
                    <label>📋 Condition</label>
                    <select id="conditionFilter">
                        <option value="all">All Conditions</option>
                        <option value="burn_care">🔥 Burn Care</option>
                        <option value="abdominal">🏥 Abdominal Surgery</option>
                        <option value="bariatric">⚖️ Bariatric Surgery</option>
                        <option value="cardiac">❤️ Cardiac Surgery</option>
                        <option value="cesarean">👶 Cesarean Section</option>
                        <option value="gynecologic">🌸 Gynecologic Surgery</option>
                        <option value="orthopedic">🦴 Orthopedic Surgery</option>
                        <option value="urological">💧 Urological Surgery</option>
                        <option value="general_health">📋 General Health</option>
                        <option value="postnatal">🤱 Postnatal</option>
                        <option value="prenatal">👼 Prenatal</option>
                        <option value="fertility">🌿 Fertility</option>
                        <option value="lifelong">🔄 Lifelong Conditions</option>
                        <option value="diabetes">🩸 Diabetes</option>
                        <option value="hypertension">💓 Hypertension</option>
                        <option value="heart">❤️ Heart Disease</option>
                        <option value="kidney">🧬 Kidney Disease</option>
                        <option value="cancer">🎗️ Cancer</option>
                        <option value="mens_sexual">💪 Men's Sexual Health</option>
                        <option value="womens_reproductive">🌸 Women's Reproductive Health</option>

                    </select>
                </div>
                <div class="filter-group">
                    <label>🔍 Search</label>
                    <input type="text" id="searchInput" placeholder="Patient name or ID...">
                </div>
                <div class="filter-group">
                    <label>📅 Date</label>
                    <input type="date" id="dateFilter">
                </div>
                <div class="filter-group">
                    <label>📊 Status</label>
                    <select id="statusFilter">
                        <option value="all">All Statuses</option>
                        <option value="urgent">🚨 Urgent</option>
                        <option value="monitor">⚠️ Monitor</option>
                        <option value="good">✅ Good Progress</option>
                    </select>
                </div>
            </div>
            <button class="refresh-btn" onclick="loadAllData()">
                🔄 Refresh Dashboard
            </button>
        </div>
        
        <div class="tabs">
    <button class="tab active" onclick="switchTab('entries')">📋 Recent Entries</button>
    <button class="tab" onclick="switchTab('patients')">👥 Patient Summary</button>
    <button class="tab" onclick="switchTab('pending')">⏳ Pending Approvals</button>
</div>
        
        <div id="entriesContainer"></div>
        <div id="patientsContainer" style="display: none;"></div>
        <div id="pendingContainer" style="display: none;"></div>
    </div>
    
    <!-- Photo Modal -->
    <div id="photoModal" class="modal" onclick="closePhotoModal()">
        <img id="fullscreenPhoto" src="">
    </div>


             
    <script>
        let allEntries = [];
        let currentTab = 'entries';
        
        const conditionConfig = {
    burn_care: { name: '🔥 Burn Care', color: '#FF5722' },
    abdominal: { name: '🏥 Abdominal', color: '#4CAF50' },
    bariatric: { name: '⚖️ Bariatric', color: '#FF6B35' },
    cardiac: { name: '❤️ Cardiac', color: '#dc3545' },
    cesarean: { name: '👶 C-Section', color: '#9C27B0' },

// Register form submission
const registerForm = document.getElementById('registerForm');
if (registerForm) {
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;
        
        if (password !== confirmPassword) {
            document.getElementById('registerError').textContent = 'Passwords do not match';
            document.getElementById('registerError').style.display = 'block';
            return;
        }
        
        const staffData = {
            username: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            password: password,
            name: document.getElementById('regName').value,
            phone_number: document.getElementById('regPhone').value,
            role: document.getElementById('regRole').value
        };
        
        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(staffData)
            });
            
            if (response.ok) {
                document.getElementById('registerSuccess').textContent = 'Registration successful! Please wait for admin approval.';
                document.getElementById('registerSuccess').style.display = 'block';
                registerForm.reset();
                setTimeout(() => {
                    loginTabBtn.click();
                }, 2000);
            } else {
                const error = await response.json();
                document.getElementById('registerError').textContent = error.detail || 'Registration failed';
                document.getElementById('registerError').style.display = 'block';
            }
        } catch (error) {
            document.getElementById('registerError').textContent = 'Network error. Please try again.';
            document.getElementById('registerError').style.display = 'block';
        }
    });
}

    const passwordInput = document.getElementById('loginPassword');

    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';

    } else {
        passwordInput.type = 'password';

// Login form submission

const loginForm = document.getElementById('loginForm');
const newLoginForm = loginForm.cloneNode(true);
loginForm.parentNode.replaceChild(newLoginForm, loginForm);

// Add fresh event listener
newLoginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    
    // Disable submit button to prevent double submission
    const submitBtn = newLoginForm.querySelector('button[type="submit"]');
    if (submitBtn.disabled) return;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('loginError');
    
    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok && data.access_token) {
            if (data.user.status === 'pending') {
                errorDiv.textContent = 'Account pending admin approval. Please check back later.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
                return;
            }
            localStorage.setItem('authToken', data.access_token);
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.reload();
        } else {
            errorDiv.textContent = data.detail || 'Invalid credentials';
            errorDiv.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
        }
    } catch (error) {
        errorDiv.textContent = 'Network error';
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
    }
});

async function approveMenPatient(patientId, patientName) {
    if (!confirm(`Approve ${patientName} for Men's Health tracking?`)) return;
    
    const token = localStorage.getItem('authToken');
    
    try {
        const response = await fetch(`/api/mens-sexual-health/approve/${patientId}`, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        });
        
        if (response.ok) {
            alert(`✅ ${patientName} has been approved for Men's Health!`);
            loadPendingApprovals();
        } else {
            const error = await response.json();

        }
    } catch (error) {
        console.error('Error approving patient:', error);
        alert('❌ Network error. Please try again.');
    }
}

        const vag = conditionData.vaginismus;
        html += `<div><strong>🌸 Vaginismus:</strong> Pain: ${vag.painDuringInsertion || '—'}/10, Dilator: ${vag.dilatorSize || '—'}/6</div>`;
    }
    
    // Endometriosis
    if (conditionData.endometriosis) {
        const endo = conditionData.endometriosis;
        html += `<div><strong>🩸 Endometriosis:</strong> Pain: ${endo.painLevel || '—'}/10, Missed work: ${endo.missedWork ? 'Yes' : 'No'}</div>`;
    }
    
    // Menopause
    if (conditionData.menopause) {
        const meno = conditionData.menopause;
        html += `<div><strong>🌡️ Menopause:</strong> Hot flashes: ${meno.hotFlashCount || '—'}/day, Severity: ${meno.hotFlashSeverity || '—'}/10</div>`;
    }
    
    // PCOS
    if (conditionData.pcos) {
        const pcos = conditionData.pcos;
        html += `<div><strong>⚖️ PCOS:</strong> Acne: ${pcos.acneSeverity || '—'}/10, Facial hair: ${pcos.facialHairSeverity || '—'}/10</div>`;

        const sti = conditionData.sti;
        html += `<div><strong>⚠️ STI:</strong> Symptoms: ${sti.symptoms?.join(', ') || 'None'}</div>`;

    return html;

        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(staffData)
    });
    
    if (response.ok) {
        alert('Staff registered successfully!');

    } else {
