<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TheClapp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #0f2b3d 0%, #1a3a4f 100%);
            color: white;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .header h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        
        .logout-btn:hover {
            background: #b91c1c;
        }
        
        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }
        
        /* Cards */
        .card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .card h2 {
            font-size: 20px;
            color: #1a2a3a;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #2d6a4f;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        button {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #1b4d3e;
        }
        
        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        
        th {
            background: #f8fafc;
            font-weight: 600;
            color: #0f2b3d;
        }
        
        .status-pending {
            color: #d97706;
            font-weight: 600;
        }
        
        .status-approved {
            color: #16a34a;
            font-weight: 600;
        }
        
        .approve-btn {
            background: #16a34a;
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 8px;
        }
        
        .reject-btn {
            background: #dc2626;
            padding: 6px 12px;
            font-size: 12px;
        }
        
        /* Login Section */
        .login-section {
            max-width: 450px;
            margin: 100px auto;
        }
        
        .alert {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .alert-success {
            background: #dcfce7;
            color: #16a34a;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #dc2626;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border-left: 4px solid #2d6a4f;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: #2d6a4f;
        }
        
        .stat-label {
            font-size: 14px;
            color: #6c757d;
            margin-top: 8px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <div class="card">
                <h2 style="text-align: center;">🔐 Admin Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>



                    <div class="form-group">
    <label>Password</label>
    <div style="position: relative;">
        <input type="password" id="loginPassword" style="padding-right: 45px;" required>
        <span onclick="toggleLoginPassword()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; font-size: 20px;">👁️</span>
    </div>
</div>




                    <button type="submit" style="width: 100%;">Login</button>
                </form>
                <div id="loginError" class="alert alert-error hidden" style="margin-top: 16px;"></div>
            </div>
        </div>
        
        <!-- Admin Dashboard (visible after login) -->
        <div id="dashboardSection" class="hidden">
            <div class="header">
                <h1>
                    🏥 TheClapp Admin Dashboard
                </h1>
                <button class="logout-btn" onclick="logout()">🔓 Logout</button>
            </div>
            
            <div class="main-container">
                <!-- Stats -->
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalStaff">0</div>
                        <div class="stat-label">Total Staff</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="pendingCount">0</div>
                        <div class="stat-label">Pending Approval</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="approvedCount">0</div>
                        <div class="stat-label">Approved Staff</div>
                    </div>
                </div>
                
                <!-- Register New Staff -->
                <div class="card">
                    <h2>➕ Register New Staff Member</h2>
                    <form id="registerForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="regName" required>
                            </div>
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" id="regUsername" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="regEmail" required>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" id="regPhone">
                            </div>
                        </div>
                        <div class="form-row">

                            <div class="form-group">
    <label>Password</label>
    <div style="position: relative;">
        <input type="password" id="regPassword" style="padding-right: 45px;" required>
        <span onclick="toggleRegPassword()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; font-size: 20px;">👁️</span>
    </div>
</div>

                            <div class="form-group">
                                <label>Role</label>
                                <select id="regRole">
                                    <option value="doctor">Doctor</option>
                                    <option value="nurse">Nurse</option>
                                    <option value="staff">Staff</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit">Register Staff</button>
                    </form>
                    <div id="registerMessage" class="alert hidden" style="margin-top: 16px;"></div>
                </div>
                
                <!-- Staff List -->
                <div class="card">
                    <h2>👥 Staff Management</h2>
                    <div id="staffTableContainer">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="staffTableBody">
                                <tr><td colspan="5" style="text-align: center;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let authToken = null;
        
        
        const savedToken = localStorage.getItem('adminToken');
if (savedToken) {
    authToken = savedToken;
    showDashboard();
    loadStaffList();
    loadStats();
}

// ✅ MOVE FUNCTIONS HERE - OUTSIDE THE IF BLOCK
function toggleLoginPassword() {
    const passwordInput = document.getElementById('loginPassword');
    const eyeIcon = event.target;
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = '🙈';
    } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = '👁️';
    }
}

function toggleRegPassword() {
    const passwordInput = document.getElementById('regPassword');
    const eyeIcon = event.target;
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = '🙈';
    } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = '👁️';
    }
}


        // Login handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    // Check if user is admin
                    if (data.user.role === 'admin') {
                        authToken = data.access_token;
                        localStorage.setItem('adminToken', authToken);
                        localStorage.setItem('adminUser', JSON.stringify(data.user));
                        showDashboard();
                        loadStaffList();
                        loadStats();
                    } else {
                        errorDiv.textContent = 'Access denied. Admin only.';
                        errorDiv.classList.remove('hidden');
                    }
                } else {
                    errorDiv.textContent = data.detail || 'Invalid credentials';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });
        
        // Register staff handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const staffData = {
                username: document.getElementById('regUsername').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                name: document.getElementById('regName').value,
                phone_number: document.getElementById('regPhone').value,
                role: document.getElementById('regRole').value
            };
            
            const messageDiv = document.getElementById('registerMessage');
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(staffData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.className = 'alert alert-success';
                    messageDiv.textContent = 'Staff registered successfully! They can now login.';
                    messageDiv.classList.remove('hidden');
                    document.getElementById('registerForm').reset();
                    loadStaffList();
                    loadStats();
                    
                    setTimeout(() => {
                        messageDiv.classList.add('hidden');
                    }, 3000);
                } else {
                    messageDiv.className = 'alert alert-error';
                    messageDiv.textContent = data.detail || 'Registration failed';
                    messageDiv.classList.remove('hidden');
                }
            } catch (error) {
                messageDiv.className = 'alert alert-error';
                messageDiv.textContent = 'Network error. Please try again.';
                messageDiv.classList.remove('hidden');
            }
        });
        
        async function loadStaffList() {
    try {
        const response = await fetch('/api/users', {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });
        
        // ✅ Handle 401 Unauthorized (expired token)
        if (response.status === 401) {
            console.log('Token expired, redirecting to login');
            alert('Session expired. Please login again.');
            logout();
            return;
        }
        
        const data = await response.json();
        
        // ✅ Check if response is an error object
        if (data.detail) {
            console.error('API Error:', data.detail);
            if (data.detail.includes('expired')) {
                alert('Session expired. Please login again.');
                logout();
                return;
            }
            document.getElementById('staffTableBody').innerHTML = `<tr><td colspan="5" style="text-align: center;">Error: ${data.detail}</td><tr>`;
            return;
        }
        
        // Handle different response formats
        let users = [];
        
        if (Array.isArray(data)) {
            users = data;
        } else if (data.users && Array.isArray(data.users)) {
            users = data.users;
        } else if (data.data && Array.isArray(data.data)) {
            users = data.data;
        } else {
            console.error('Unknown API response format:', data);
            document.getElementById('staffTableBody').innerHTML = '<tr><td colspan="5" style="text-align: center;">Error: Unexpected data format</td><tr>';
            return;
        }
        
        console.log('Users found:', users.length);
        
        if (users.length === 0) {
            document.getElementById('staffTableBody').innerHTML = '<tr><td colspan="5" style="text-align: center;">No staff found</td><tr>';
            return;
        }
        
        let html = '';
        users.forEach(user => {
            const statusClass = user.status === 'approved' ? 'status-approved' : 'status-pending';
            const statusText = user.status === 'approved' ? '✅ Approved' : '⏳ Pending';
            
            html += `
                <tr>
                    <td>${user.name || user.username}</td>
                    <td>${user.email}</td>
                    <td>${user.role}</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td>
                        ${user.status !== 'approved' ? `<button class="approve-btn" onclick="approveStaff(${user.id})">Approve</button>` : ''}
                        <button class="reject-btn" onclick="deleteStaff(${user.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
        document.getElementById('staffTableBody').innerHTML = html;
    } catch (error) {
        console.error('Error loading staff:', error);
        document.getElementById('staffTableBody').innerHTML = '<td><td colspan="5" style="text-align: center;">Error loading staff</td><tr>';
    }
}
        



        async function loadStats() {
            try {
                const response = await fetch('/api/users/stats', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const stats = await response.json();
                
                document.getElementById('totalStaff').textContent = stats.total || 0;
                document.getElementById('pendingCount').textContent = stats.pending || 0;
                document.getElementById('approvedCount').textContent = stats.approved || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        async function approveStaff(userId) {
            try {
                const response = await fetch(`/api/users/${userId}/approve`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (response.ok) {
                    alert('Staff approved successfully!');
                    loadStaffList();
                    loadStats();
                } else {
                    alert('Approval failed');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        async function deleteStaff(userId) {
            if (confirm('Are you sure you want to delete this staff member?')) {
                try {
                    const response = await fetch(`/api/users/${userId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    
                    if (response.ok) {
                        alert('Staff deleted successfully');
                        loadStaffList();
                        loadStats();
                    } else {
                        alert('Delete failed');
                    }
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            }
        }
        
        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
        }
        
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            authToken = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginForm').reset();
        }
    </script>
</body>
</html>
