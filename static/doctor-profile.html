<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile Management - TheClapp Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #0f2b3d 0%, #1a3a4f 100%);
            color: white;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .header h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2d6a4f;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #2d6a4f;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1b4d3e;
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #1a2a3a;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        
        th {
            background: #f8fafc;
            font-weight: 600;
            color: #0f2b3d;
        }
        
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            margin: 0 4px;
            padding: 4px 8px;
            border-radius: 6px;
        }
        
        .edit-btn {
            color: #2d6a4f;
        }
        
        .edit-btn:hover {
            background: #dcfce7;
        }
        
        .status-active {
            background: #dcfce7;
            color: #16a34a;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .status-inactive {
            background: #fee2e2;
            color: #dc2626;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
        }
        
        .alert-success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #16a34a;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #dc2626;
        }
        
        .search-bar {
            margin-bottom: 20px;
        }
        
        .search-bar input {
            max-width: 400px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 90%;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h3 {
            font-size: 20px;
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        /* Login Overlay */
        #authOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0f4f8;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .hidden {
            display: none;
        }
        
        .image-preview {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="authOverlay">
    <div class="login-card">
        <h2 style="margin-bottom: 20px; text-align: center;">🔐 Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            <div id="loginError" class="alert alert-error" style="margin-top: 16px;"></div>
        </form>
    </div>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent" style="display: none;">
    <div class="header">
        <h1>
            👨‍⚕️ Doctor Profile Management
        </h1>
        <button class="logout-btn" onclick="logout()">🔓 Logout</button>
    </div>
    
    <div class="container">
        <div id="alert" class="alert"></div>
        
        <!-- Doctor List -->
        <div class="card">
            <h2>👨‍⚕️ Doctors List</h2>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search by name, specialization, or department..." oninput="filterDoctors()">
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr><th>Photo</th><th>Name</th><th>Specialization</th><th>Department</th><th>Phone</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="doctorsTableBody">
                        <tr><td colspan="7" style="text-align: center;">Loading...</td</tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Edit Doctor Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>✏️ Edit Doctor Profile</h3>
            <button class="close-modal" onclick="closeEditModal()">&times;</button>
        </div>
        <form id="editDoctorForm">
            <input type="hidden" id="editDoctorId">
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editName">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="editPhone">
                </div>
                <div class="form-group">
                    <label>Specialization</label>
                    <input type="text" id="editSpecialization" placeholder="Cardiologist, Neurologist, etc.">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="editDepartment" placeholder="Cardiology, Neurology, etc.">
                </div>
                <div class="form-group">
                    <label>Years of Experience</label>
                    <input type="number" id="editExperience" placeholder="0">
                </div>
            </div>
            <div class="form-group">
                <label>Education</label>
                <textarea id="editEducation" rows="2" placeholder="MD, PhD, Fellowships..."></textarea>
            </div>
            <div class="form-group">
                <label>Bio / Description</label>
                <textarea id="editDescription" rows="3" placeholder="Professional background, expertise..."></textarea>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="editStatus">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 16px;">
                <button type="submit" class="btn btn-primary">💾 Save Changes</button>
                <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    let authToken = localStorage.getItem('authToken');
    let allDoctors = [];
    
    // Check login
    if (authToken) {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        loadDoctors();
    }
    
    // Login handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const errorDiv = document.getElementById('loginError');
        
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            
            if (response.ok && data.access_token) {
                if (data.user.role !== 'admin') {
                    errorDiv.textContent = 'Admin access only';
                    errorDiv.style.display = 'block';
                    return;
                }
                localStorage.setItem('authToken', data.access_token);
                location.reload();
            } else {
                errorDiv.textContent = data.detail || 'Invalid credentials';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.textContent = 'Network error';
            errorDiv.style.display = 'block';
        }
    });
    
    // Load Doctors
async function loadDoctors() {
    try {
        const response = await fetch('/api/doctors/search?q=', {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await response.json();
        allDoctors = data.doctors || [];
        renderDoctors(allDoctors);
    } catch (err) {
        console.error('Error loading doctors:', err);
        document.getElementById('doctorsTableBody').innerHTML = '<tr><td colspan="7">Error loading doctors</td></tr>';
    }
}
    
    function renderDoctors(doctors) {
        const tbody = document.getElementById('doctorsTableBody');
        if (doctors.length === 0) {
            tbody.innerHTML = '<td><td colspan="7" style="text-align: center;">No doctors found</td></tr>';
            return;
        }
        
        let html = '';
        doctors.forEach(doctor => {
            const statusClass = doctor.is_active !== false ? 'status-active' : 'status-inactive';
            const statusText = doctor.is_active !== false ? 'Active' : 'Inactive';
            
            html += `
                <tr>
                    <td><div class="image-preview"><span style="font-size: 20px;">👨‍⚕️</span></div></td>
                    <td><strong>Dr. ${doctor.name || doctor.username}</strong></td>
                    <td>${doctor.specialization || '—'}</td>
                    <td>${doctor.department || '—'}</td>
                    <td>${doctor.phone_number || '—'}</td>
                    <td><span class="${statusClass}">${statusText}</span></td>
                    <td>
                        <button class="action-btn edit-btn" onclick="openEditModal(${doctor.id})" title="Edit">✏️</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }
    
    function filterDoctors() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allDoctors.filter(doctor => 
            (doctor.name && doctor.name.toLowerCase().includes(searchTerm)) ||
            (doctor.specialization && doctor.specialization.toLowerCase().includes(searchTerm)) ||
            (doctor.department && doctor.department.toLowerCase().includes(searchTerm))
        );
        renderDoctors(filtered);
    }
    
    // Open Edit Modal - uses /api/doctors/${id} endpoint
    async function openEditModal(doctorId) {
        try {
            const response = await fetch(`/api/doctors/${doctorId}`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const data = await response.json();
            const doctor = data.doctor;
            
            document.getElementById('editDoctorId').value = doctor.id;
            document.getElementById('editName').value = doctor.name || '';
            document.getElementById('editEmail').value = doctor.email || '';
            document.getElementById('editPhone').value = doctor.phone_number || '';
            document.getElementById('editSpecialization').value = doctor.specialization || '';
            document.getElementById('editDepartment').value = doctor.department || '';
            document.getElementById('editExperience').value = doctor.experience_years || 0;
            document.getElementById('editEducation').value = doctor.education || '';
            document.getElementById('editDescription').value = doctor.description || '';
            document.getElementById('editStatus').value = doctor.is_active !== false ? 'true' : 'false';
            
            document.getElementById('editModal').classList.add('active');
        } catch (err) {
            showAlert('Error loading doctor data', 'error');
        }
    }
    
    // Save Edit - uses PUT /api/users/${doctorId} endpoint
    document.getElementById('editDoctorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const doctorId = document.getElementById('editDoctorId').value;
        const updateData = {
            name: document.getElementById('editName').value,
            email: document.getElementById('editEmail').value,
            phone_number: document.getElementById('editPhone').value,
            specialization: document.getElementById('editSpecialization').value,
            department: document.getElementById('editDepartment').value,
            experience_years: parseInt(document.getElementById('editExperience').value) || 0,
            education: document.getElementById('editEducation').value,
            description: document.getElementById('editDescription').value,
            is_active: document.getElementById('editStatus').value === 'true'
        };
        
        try {
            const response = await fetch(`/api/users/${doctorId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify(updateData)
            });
            
            if (response.ok) {
                showAlert('Doctor profile updated successfully!', 'success');
                closeEditModal();
                loadDoctors();
            } else {
                showAlert('Update failed', 'error');
            }
        } catch (err) {
            showAlert('Network error', 'error');
        }
    });
    
    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
    }
    
    function showAlert(msg, type) {
        const alertDiv = document.getElementById('alert');
        alertDiv.textContent = msg;
        alertDiv.className = `alert alert-${type}`;
        alertDiv.style.display = 'block';
        setTimeout(() => alertDiv.style.display = 'none', 3000);
    }
    
    function logout() {
        localStorage.removeItem('authToken');
        location.reload();
    }
    
    // Close modal when clicking outside
    window.onclick = function(event) {
        const modal = document.getElementById('editModal');
        if (event.target === modal) {
            closeEditModal();
        }
    };
</script>
</body>
</html>
